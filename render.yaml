# Render Blueprint for the FastAPI backend (Render dashboard → New → Blueprint → pick this repo).
# One free web service = one server process, so every request sees the same SQLite file.
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    plan: free
    rootDir: backend
    # Only backend changes redeploy the API (a redeploy resets the free plan's temporary disk).
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:///./zoom_clone.db
      - key: FRONTEND_URL
        value: https://harsh-zoom-clone.vercel.app
